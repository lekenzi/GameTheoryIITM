<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Index</title>
  <style>
    :root {
      --bg: #f7f4ed;
      --card: #fffdf7;
      --text: #1f2933;
      --muted: #52606d;
      --line: #e4e7eb;
      --accent: #0b6e4f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(1200px 400px at 10% -10%, #dff3ea 0%, transparent 60%),
        radial-gradient(900px 400px at 90% -20%, #fce8c3 0%, transparent 60%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: start center;
      padding: 48px 16px;
    }

    .container {
      width: min(900px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(12, 27, 45, 0.08);
      overflow: hidden;
    }

    header {
      padding: 24px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.7rem;
      letter-spacing: 0.01em;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    main { padding: 12px 0; }

    #status {
      padding: 16px 24px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    li {
      border-top: 1px solid var(--line);
    }

    li:first-child {
      border-top: none;
    }

    a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 24px;
      color: var(--text);
      text-decoration: none;
      transition: background-color 120ms ease;
    }

    a:hover {
      background: #eef7f2;
    }

    .name {
      font-weight: 600;
      word-break: break-word;
    }

    .label {
      font-size: 0.8rem;
      color: var(--accent);
      border: 1px solid #a8d8c8;
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .empty {
      padding: 20px 24px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Programming in C PDF Library</h1>
      <p>This page lists all PDF files in this folder on GitHub Pages.</p>
    </header>

    <main>
      <div id="status">Loading PDFs...</div>
      <ul id="pdf-list" hidden></ul>
    </main>
  </div>

  <script>
    function getRepoInfoFromPageUrl() {
      const hostParts = window.location.hostname.split('.');
      const owner = hostParts[0];
      const pathParts = window.location.pathname.split('/').filter(Boolean);

      // For project pages: /repo/... ; for user pages this can be empty.
      const repo = pathParts[0] || '';
      const folderParts = pathParts.slice(1);
      if (folderParts[folderParts.length - 1] === 'index.html') {
        folderParts.pop();
      }
      const folderPath = folderParts.join('/');

      return { owner, repo, folderPath };
    }

    function encodePath(path) {
      return path
        .split('/')
        .map(encodeURIComponent)
        .join('/');
    }

    function renderPdfs(pdfFiles) {
      const status = document.getElementById('status');
      const list = document.getElementById('pdf-list');

      status.hidden = true;
      list.hidden = false;

      if (pdfFiles.length === 0) {
        list.outerHTML = '<div class="empty">No PDF files found in this folder.</div>';
        return;
      }

      const items = pdfFiles
        .sort((a, b) => a.name.localeCompare(b.name))
        .map((file) => {
          const href = './' + encodePath(file.name);
          return '<li><a href="' + href + '" target="_blank" rel="noopener">' +
            '<span class="name">' + file.name + '</span>' +
            '<span class="label">Open PDF</span>' +
            '</a></li>';
        })
        .join('');

      list.innerHTML = items;
    }

    function renderError(message) {
      const status = document.getElementById('status');
      status.textContent = message;
    }

    async function loadPdfs() {
      const { owner, repo, folderPath } = getRepoInfoFromPageUrl();

      if (!owner || !repo) {
        renderError('Could not detect repository details from this URL.');
        return;
      }

      const apiPath = folderPath ? '/' + encodePath(folderPath) : '';
      const endpoint = 'https://api.github.com/repos/' + owner + '/' + repo + '/contents' + apiPath;

      try {
        const response = await fetch(endpoint, { headers: { Accept: 'application/vnd.github+json' } });

        if (!response.ok) {
          throw new Error('GitHub API returned ' + response.status + '.');
        }

        const files = await response.json();
        const pdfs = Array.isArray(files)
          ? files.filter((file) => file.type === 'file' && /\.pdf$/i.test(file.name))
          : [];

        renderPdfs(pdfs);
      } catch (error) {
        renderError('Could not load PDF list automatically. ' + error.message);
      }
    }

    loadPdfs();
  </script>
</body>
</html>
